# Модели шлюза и цепочки по задачам (docs/04-llm.md §2.1).
# id — точные имена из GET /models шлюза. capabilities и token_param уточняет `alfa llm probe --write-config`.
# Цены — ₽ за 1 млн токенов, измерены 24.10.2026 по usage.cost шлюза (два запроса на модель: длинный вход и длинный выход).
# Фактическую стоимость вызова шлюз возвращает в usage.cost (₽), она и идёт в учёт бюджета; цены нужны для оценки до вызова.
# reasoning: false в задачах отключает рассуждения моделей (шлюз принимает reasoning: {enabled: false}) — дешевле и быстрее в разы.
version: 1
gateway:
  timeout_s: 60
  connect_timeout_s: 10
  max_concurrency_interactive: 4
  max_concurrency_background: 2
  retries: 2
  retry_delays_s: [1.0, 3.0]
  token_param: max_tokens
default_price_rub_per_1m: {input: 50, output: 200}
models:
  gemma: {id: "google/gemma-4-26b-a4b-it", family: gemma, context_tokens: 128000, price_rub_per_1m: {input: 4.38, output: 34.75},
    capabilities: {tools: true, json_schema: true, json_object: true, vision: false, usage: true, reasoning_toggle: true}, token_param: max_tokens}
  qwen_text: {id: "qwen/qwen3.6-35b-a3b", family: qwen, context_tokens: 262144, price_rub_per_1m: {input: 10.42, output: 132.74},
    capabilities: {tools: true, json_schema: true, json_object: true, vision: false, usage: true, reasoning_toggle: true}, token_param: max_tokens}
  deepseek: {id: "deepseek/deepseek-v4.1-flash", family: deepseek, context_tokens: 1048576, price_rub_per_1m: {input: 17.28, output: 69.1},
    capabilities: {tools: true, json_schema: true, json_object: true, vision: false, usage: true, reasoning_toggle: true}, token_param: max_tokens}
  glm: {id: "z-ai/glm-5.3-flash", family: glm, context_tokens: 128000, price_rub_per_1m: {input: 17.28, output: 57.58},
    capabilities: {tools: true, json_schema: true, json_object: true, vision: false, usage: true, reasoning_toggle: false}, token_param: max_tokens}
  kimi: {id: "moonshotai/kimi-k2.6", family: kimi, context_tokens: 262144, price_rub_per_1m: {input: 99.46, output: 418.8},
    capabilities: {tools: true, json_schema: true, json_object: true, vision: false, usage: true, reasoning_toggle: true}, token_param: max_tokens}
  qwen_vl: {id: "qwen/qwen3-vl-30b-a3b-instruct", family: qwen, context_tokens: 262144, price_rub_per_1m: {input: 15.7, output: 62.82},
    capabilities: {tools: true, json_schema: true, json_object: true, vision: true, usage: true, reasoning_toggle: true}, token_param: max_tokens}
tasks:
  tagging:             {chain: [gemma, qwen_text],    temperature: 0,   max_tokens: 1200, priority: background,  strategy: auto,        timeout_s: 30, reasoning: false}
  tagging_interactive: {chain: [gemma, qwen_text],    temperature: 0,   max_tokens: 1200, priority: interactive, strategy: auto,        timeout_s: 20, reasoning: false,
                        hedge_after_s: 4.5}
  research_extract:    {chain: [qwen_text, deepseek], temperature: 0,   max_tokens: 2000, priority: background,  strategy: auto,        timeout_s: 60, reasoning: false}
  ocr:                 {chain: [qwen_vl],             temperature: 0,   max_tokens: 4000, priority: background,  strategy: prompt_only, timeout_s: 150, reasoning: false, cache: false}
  vision:              {chain: [qwen_vl],             temperature: 0,   max_tokens: 3000, priority: background,  strategy: json_object, timeout_s: 90, reasoning: false}
  rerank:              {chain: [gemma, qwen_text],    temperature: 0,   max_tokens: 800,  priority: precompute,  strategy: auto,        timeout_s: 30, reasoning: false}
  agent:               {chain: [deepseek, kimi],      temperature: 0.2, max_tokens: 4000, priority: interactive, strategy: tool_call,   timeout_s: 45, reasoning: false}
  draft:               {chain: [deepseek, kimi],      temperature: 0.2, max_tokens: 4000, priority: precompute,  strategy: auto,        timeout_s: 45, reasoning: false}
  revise:              {chain: [deepseek, kimi],      temperature: 0.1, max_tokens: 4000, priority: precompute,  strategy: auto,        timeout_s: 45, reasoning: false}
  verify:              {chain: [glm, qwen_text],      temperature: 0,   max_tokens: 2000, priority: precompute,  strategy: auto,        timeout_s: 40, reasoning: false,
                        exclude_drafter_family: true}
  # Офлайн-оценка (12-quality.md §2.3): предразметка сильнейшей моделью другого семейства, чем разметка новостей
  eval_label:          {chain: [kimi, deepseek],      temperature: 0,   max_tokens: 3000, priority: background,  strategy: auto,        timeout_s: 90, reasoning: false}
  chat:                {chain: [deepseek, kimi],      temperature: 0.3, max_tokens: 1500, priority: interactive, strategy: tool_call,   timeout_s: 30, reasoning: false,
                        cache: false}
