[project]
name = "alfa-insight"
version = "0.1.0"
description = "Альфа Инсайт — персональная новостная аналитика для крупного бизнеса"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9", "pydantic-settings>=2.6",
  "typer>=0.12", "structlog>=24.4", "duckdb>=1.1", "httpx>=0.27", "feedparser>=6.0",
  "trafilatura>=2.0", "pymorphy3>=2.0", "pymorphy3-dicts-ru", "openai>=1.50",
  "apscheduler>=3.10,<4", "sse-starlette>=2.1", "itsdangerous>=2.2", "jinja2>=3.1",
  "pyyaml>=6.0", "orjson>=3.10", "pdfplumber>=0.11",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11",
       "types-PyYAML", "reportlab>=4", "pip-licenses>=5"]

[project.scripts]
alfa = "alfa_insight.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alfa_insight"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
